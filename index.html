<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#292524" />
    <title>TeslaUSB</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <!-- Google Fonts - loads from CDN when internet available -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Inline fallback font-face rules for offline use (weak Tesla WiFi) -->
    <style>
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src:
          local('Manrope Regular'),
          local('Manrope-Regular'),
          url('./fonts/manrope-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src:
          local('Manrope SemiBold'),
          local('Manrope-SemiBold'),
          url('./fonts/manrope-semibold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src:
          local('Manrope Bold'),
          local('Manrope-Bold'),
          url('./fonts/manrope-bold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src:
          local('DM Sans Regular'),
          local('DMSans-Regular'),
          url('./fonts/dm-sans-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src:
          local('DM Sans Medium'),
          local('DMSans-Medium'),
          url('./fonts/dm-sans-medium.woff2') format('woff2');
      }
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src:
          local('DM Sans SemiBold'),
          local('DMSans-SemiBold'),
          url('./fonts/dm-sans-semibold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src:
          local('JetBrains Mono'),
          local('JetBrainsMono-Regular'),
          url('./fonts/jetbrains-mono-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src:
          local('JetBrains Mono Medium'),
          local('JetBrainsMono-Medium'),
          url('./fonts/jetbrains-mono-medium.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
